<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 深蓝色背景圆角矩形 -->
  <rect x="8" y="8" width="112" height="112" rx="16" ry="16" fill="url(#blueGradient)" stroke="#1D4ED8" stroke-width="2"/>
  
  <!-- XML 主体文字 (白色实心+描边，更清晰) -->
  <text x="64" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="white" stroke="#1E3A8A" stroke-width="1">
    XML
  </text>
  
  <!-- AR 前缀文字 (白色实心+描边，更清晰) -->
  <text x="25" y="35" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="start" fill="white" stroke="#1E3A8A" stroke-width="1">
    AR
  </text>
  
  <!-- 装饰性的XML标签符号 (白色) -->
  <g transform="translate(85, 20)" fill="none" stroke="white" stroke-width="2.5" opacity="0.9">
    <!-- 左尖括号 -->
    <path d="M8 5 L2 10 L8 15"/>
    <!-- 右尖括号 -->
    <path d="M12 5 L18 10 L12 15"/>
  </g>
  
  <!-- 底部装饰线条 (白色) -->
  <rect x="20" y="95" width="88" height="3" rx="1.5" fill="white" opacity="0.7"/>
  <rect x="30" y="102" width="68" height="2" rx="1" fill="white" opacity="0.5"/>
</svg>